# newsyslog configuration for Ollama logs
# Format: logfilename [owner:group] mode count size when flags [/pid_file] [sig_num]
#
# Flags:
#   J = compress with bzip2
#   G = glob pattern for old logs
#   N = no signal (don't signal syslogd)
#   U = create file if it doesn't exist
#
# Size: in kilobytes (1000 = 1MB)
# When: * = size-based rotation only
# Count: number of old logs to keep

# Main Ollama logs - rotate when >5MB, keep 10 copies, compress with bzip2
# Note: These will be handled by our custom rotation script for proper service restart
# /Users/<OLLAMA_USER>/mac-studio-server/logs/ollama.log	<OLLAMA_USER>:staff	644  10    5000   *     JNU
# /Users/<OLLAMA_USER>/mac-studio-server/logs/ollama.err	<OLLAMA_USER>:staff	644  10    5000   *     JNU

# Other logs - rotate when >1MB, keep 5 copies
/Users/<OLLAMA_USER>/mac-studio-server/logs/install.log		<OLLAMA_USER>:staff	644  5     1000   *     NU
/Users/<OLLAMA_USER>/mac-studio-server/logs/optimization.log	<OLLAMA_USER>:staff	644  5     1000   *     NU
/Users/<OLLAMA_USER>/mac-studio-server/logs/ollama-restart.log	<OLLAMA_USER>:staff	644  5     1000   *     NU
/Users/<OLLAMA_USER>/mac-studio-server/logs/gpu-memory.log	<OLLAMA_USER>:staff	644  5     1000   *     NU
/Users/<OLLAMA_USER>/mac-studio-server/logs/gpu-memory.err	<OLLAMA_USER>:staff	644  5     1000   *     NU
